<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THRIVE · 프로필 수정</title>
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/mypage.css" />
    <link rel="stylesheet" href="../../styles/icons.css" />
  </head>
  <body>
    <div class="app" id="app">
      <div id="header-mount"></div>
      <main class="app__body">

        <div class="field">
          <label class="field__label">닉네임</label>
          <input class="field__input" type="text" value="유저" />
        </div>

        <div class="profile-row">
          <div class="field">
            <label class="field__label">성별</label>
            <button type="button" class="field__select field__select--btn profile-row__control" id="gender-trigger" style="text-align:left;">
              <span id="gender-value">여성</span>
            </button>
          </div>
          <div class="field">
            <label class="field__label">나이</label>
            <input class="field__input profile-row__control" type="text" inputmode="numeric" pattern="[0-9]*" id="age-input" value="28세" />
          </div>
        </div>

        <button type="button" class="btn btn--primary btn--block" id="profile-save">저장</button>
      </main>

      <!-- 성별 선택 바텀시트 -->
      <div id="gender-sheet" class="sheet-overlay" hidden>
        <div class="sheet">
          <div class="sheet__handle"></div>
          <h2 class="text-heading-3">성별</h2>
          <div class="sheet__options">
            <button type="button" class="sheet__option is-selected" data-gender="여성">여성</button>
            <button type="button" class="sheet__option" data-gender="남성">남성</button>
          </div>
          <button type="button" class="btn btn--primary btn--block" id="gender-confirm">확인</button>
        </div>
      </div>

      <!-- 저장 완료 토스트 -->
      <div id="save-toast" class="toast" hidden>내용이 저장되었어요.</div>
    </div>
    <script src="../../components/header.js"></script>
    <script>
      document.getElementById("header-mount").append(
        THRIVE.createHeader({
          title: "프로필 수정",
          onClose: function () { window.location.href = "./profile.html"; },
        })
      );

      var sheet = document.getElementById("gender-sheet");
      var genderValue = document.getElementById("gender-value");
      var selected = "여성";

      document.getElementById("gender-trigger").addEventListener("click", function () {
        sheet.hidden = false;
      });

      document.querySelectorAll(".sheet__option").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".sheet__option").forEach(function (b) {
            b.classList.remove("is-selected");
          });
          btn.classList.add("is-selected");
          selected = btn.dataset.gender;
        });
      });

      document.getElementById("gender-confirm").addEventListener("click", function () {
        genderValue.textContent = selected;
        sheet.hidden = true;
      });

      // 바텀시트 바깥(어두운 배경) 클릭하면 닫기
      sheet.addEventListener("click", function (e) {
        if (e.target === sheet) sheet.hidden = true;
      });

      // 나이 입력창: 숫자만 입력받고 "세" 자동으로 붙이기
      var ageInput = document.getElementById("age-input");
      ageInput.addEventListener("focus", function () {
        ageInput.value = ageInput.value.replace("세", "");
      });
      ageInput.addEventListener("blur", function () {
        var digits = ageInput.value.replace(/[^0-9]/g, "");
        if (digits) ageInput.value = digits + "세";
      });

      // 저장 버튼: 토스트 띄우고 5초 뒤 사라짐, 그 후 profile.html로 이동
      var saveToast = document.getElementById("save-toast");
      var toastTimer = null;

      document.getElementById("profile-save").addEventListener("click", function () {
        saveToast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          saveToast.hidden = true;
          window.location.href = "./profile.html";
        }, 5000);
      });
    </script>
  </body>
</html>
