<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THRIVE · 비행 여정 등록</title>
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/record.css" />
    <link rel="stylesheet" href="../../styles/mypage.css" />
    <link rel="stylesheet" href="../../styles/icons.css" />
  </head>
  <body>
    <div class="app" id="app">
      <div id="header-mount"></div>
      <main class="app__body">

        <!-- ===== STEP 1: 출발 ===== -->
        <section class="trip-step" data-step="1">
          <div class="step-dots"><span class="is-active"></span><span></span><span></span></div>
          <h1 class="text-title-1">출발</h1>

          <div class="field">
            <label class="field__label">출발</label>
            <button type="button" class="field__select field__select--btn" id="departure-trigger" style="text-align:left;">
              <span id="departure-value" style="color: var(--color-text-subtle);">Select...</span>
            </button>
          </div>

          <button type="button" class="info-row" id="depart-date-trigger">
            <span class="info-row__label">출발일</span>
            <span class="info-row__value" id="depart-date-value">Select...</span>
            <svg class="info-row__chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 15l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button type="button" class="info-row">
            <span class="info-row__label">출발 시각</span>
            <span class="info-row__value">15:30</span>
            <svg class="info-row__chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 15l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <div class="field">
            <label class="field__label">경유 여부</label>
            <div style="display:flex; gap: var(--space-2);">
              <button type="button" class="btn" style="flex:1; background: var(--color-gray-050); color: var(--color-text);" data-via="no">없음</button>
              <button type="button" class="btn btn--primary" style="flex:1;" data-via="yes">있음</button>
            </div>
          </div>

          <button type="button" class="info-row" id="wait-time-field" style="display: flex;">
            <span class="info-row__label">대기 시간</span>
            <span class="info-row__value">8시간 50분</span>
            <svg class="info-row__chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 15l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button type="button" class="btn btn--primary btn--block" data-next="2" id="step1-next" disabled>다음</button>
        </section>

        <!-- ===== STEP 2: 도착 ===== -->
        <section class="trip-step" data-step="2" hidden>
          <div class="step-dots"><span></span><span class="is-active"></span><span></span></div>
          <h1 class="text-title-1">도착</h1>

          <div class="field">
            <label class="field__label">도착지</label>
            <button type="button" class="field__select field__select--btn" id="arrival-trigger" style="text-align:left;">
              <span id="arrival-value" style="color: var(--color-text-subtle);">Select...</span>
            </button>
            <p class="field-error" id="arrival-error">*필수 선택란입니다.</p>
          </div>

          <button type="button" class="info-row" id="arrive-date-trigger">
            <span class="info-row__label">도착일</span>
            <span class="info-row__value" id="arrive-date-value">Select...</span>
            <svg class="info-row__chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 15l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button type="button" class="info-row" id="arrive-time-trigger">
            <span class="info-row__label">도착 시각</span>
            <span class="info-row__value" id="arrive-time-value">Select...</span>
            <svg class="info-row__chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 15l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <section>
            <h2 class="text-heading-1">여행 일정</h2>
            <button type="button" class="info-row" id="trip-length-trigger">
              <span class="info-row__label">예정된 여행 기간</span>
              <span class="info-row__value" id="trip-length-value">Select...</span>
              <svg class="info-row__chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 15l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </section>

          <div class="step-nav-row">
            <button type="button" class="btn step-nav-back" data-prev="1">뒤로</button>
            <button type="button" class="btn btn--primary step-nav-forward" data-next="3">다음</button>
          </div>
        </section>

        <!-- ===== STEP 3: 장거리 비행 여부 ===== -->
        <section class="trip-step" data-step="3" hidden>
          <div class="step-dots"><span></span><span></span><span class="is-active"></span></div>
          <h1 class="text-title-1">장거리 비행 여부</h1>
          <p class="text-caption text-muted">최근 1년 사이, 6시간 이상의 비행 경험이 있으신가요?</p>

          <div class="field">
            <div style="display:flex; gap: var(--space-2);">
              <button type="button" class="btn" style="flex:1; background: var(--color-gray-050); color: var(--color-text);" data-longhaul="no">없음</button>
              <button type="button" class="btn btn--soft-selected" style="flex:1;" data-longhaul="yes">있음</button>
            </div>
          </div>

          <button type="button" class="info-row" id="last-flight-trigger">
            <span class="info-row__label">마지막 비행 일자</span>
            <span class="info-row__value" id="last-flight-value">Select...</span>
            <svg class="info-row__chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 15l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <button type="button" class="info-row" id="total-flight-time-trigger">
            <span class="info-row__label">총 비행 시간</span>
            <span class="info-row__value" id="total-flight-time-value">Select...</span>
            <svg class="info-row__chevron" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7.5 15l5-5-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>

          <section>
            <h2 class="text-heading-1">평소 컨디션</h2>
            <p class="text-caption text-muted">평소 이동 거리 및 시간이 어느 정도 영향을 미치나요?</p>
            <div class="option-grid">
              <button type="button" class="btn" style="background: var(--color-gray-050); color: var(--color-text);" data-condition="none">아무런 영향 없음</button>
              <button type="button" class="btn" style="background: var(--color-gray-050); color: var(--color-text);" data-condition="recover">도착 직후 회복함</button>
              <button type="button" class="btn" style="background: var(--color-gray-050); color: var(--color-text);" data-condition="tired">살짝 피로함</button>
              <button type="button" class="btn btn--soft-selected" data-condition="impact">일정에 영향 줌</button>
            </div>
          </section>

          <div class="step-nav-row trip-step-bottom-space">
            <button type="button" class="btn step-nav-back" data-prev="2">뒤로</button>
            <button type="button" class="btn btn--primary step-nav-forward" id="trip-confirm">확인</button>
          </div>
        </section>

      </main>

      <!-- 출발 공항 선택 바텀시트 -->
      <div id="airport-sheet" class="sheet-overlay" hidden>
        <div class="sheet">
          <div class="sheet__handle"></div>
          <h2 class="text-heading-3">공항</h2>
          <select class="field__select" id="airport-filter">
            <option value="">출발지</option>
          </select>
          <div class="airport-list" id="airport-list">
            <button type="button" class="airport-list__item" data-airport="ICN 인천국제공항">ICN 인천국제공항</button>
            <button type="button" class="airport-list__item" data-airport="MXP 말펜사공항">MXP 말펜사공항</button>
            <button type="button" class="airport-list__item" data-airport="BKK 수완나품국제공항">BKK 수완나품국제공항</button>
            <button type="button" class="airport-list__item" data-airport="LAX 로스앤젤레스국제공항">LAX 로스앤젤레스국제공항</button>
            <button type="button" class="airport-list__item" data-airport="DAD 다낭국제공항">DAD 다낭국제공항</button>
            <button type="button" class="airport-list__item" data-airport="SIN 창이국제공항">SIN 창이국제공항</button>
            <button type="button" class="airport-list__item" data-airport="DPS 응우라이국제공항">DPS 응우라이국제공항</button>
            <button type="button" class="airport-list__item" data-airport="TPE 타이완타오위안국제공항">TPE 타이완타오위안국제공항</button>
          </div>
          <button type="button" class="btn btn--primary btn--block" id="airport-confirm">입력</button>
        </div>
      </div>

      <!-- 출발일 선택 바텀시트 -->
      <div id="date-sheet" class="sheet-overlay" hidden>
        <div class="sheet">
          <div class="sheet__handle"></div>
          <h2 class="text-heading-3">출발일</h2>
          <div class="date-input-row">
            <input class="field__input date-input" type="text" inputmode="numeric" maxlength="4" placeholder="2000" id="date-year" />
            <span class="date-input-unit">년</span>
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="2" placeholder="00" id="date-month" />
            <span class="date-input-unit">월</span>
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="2" placeholder="00" id="date-day" />
            <span class="date-input-unit">일</span>
          </div>
          <button type="button" class="btn btn--primary btn--block" id="date-confirm">입력</button>
        </div>
      </div>

      <!-- 도착지 선택 바텀시트 -->
      <div id="arrival-sheet" class="sheet-overlay" hidden>
        <div class="sheet">
          <div class="sheet__handle"></div>
          <h2 class="text-heading-3">공항</h2>
          <select class="field__select" id="arrival-filter">
            <option value="">도착지</option>
          </select>
          <div class="airport-list" id="arrival-list">
            <button type="button" class="airport-list__item" data-airport="ICN 인천국제공항">ICN 인천국제공항</button>
            <button type="button" class="airport-list__item" data-airport="MXP 말펜사공항">MXP 말펜사공항</button>
            <button type="button" class="airport-list__item" data-airport="BKK 수완나품국제공항">BKK 수완나품국제공항</button>
            <button type="button" class="airport-list__item" data-airport="LAX 로스앤젤레스국제공항">LAX 로스앤젤레스국제공항</button>
            <button type="button" class="airport-list__item" data-airport="DAD 다낭국제공항">DAD 다낭국제공항</button>
            <button type="button" class="airport-list__item" data-airport="SIN 창이국제공항">SIN 창이국제공항</button>
            <button type="button" class="airport-list__item" data-airport="DPS 응우라이국제공항">DPS 응우라이국제공항</button>
            <button type="button" class="airport-list__item" data-airport="TPE 타이완타오위안국제공항">TPE 타이완타오위안국제공항</button>
          </div>
          <button type="button" class="btn btn--primary btn--block" id="arrival-confirm">입력</button>
        </div>
      </div>

      <!-- 도착일 선택 바텀시트 -->
      <div id="arrive-date-sheet" class="sheet-overlay" hidden>
        <div class="sheet">
          <div class="sheet__handle"></div>
          <h2 class="text-heading-3">도착일</h2>
          <div class="date-input-row">
            <input class="field__input date-input" type="text" inputmode="numeric" maxlength="4" placeholder="2000" id="arrive-date-year" />
            <span class="date-input-unit">년</span>
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="2" placeholder="00" id="arrive-date-month" />
            <span class="date-input-unit">월</span>
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="2" placeholder="00" id="arrive-date-day" />
            <span class="date-input-unit">일</span>
          </div>
          <button type="button" class="btn btn--primary btn--block" id="arrive-date-confirm">입력</button>
        </div>
      </div>

      <!-- 도착 시각 선택 바텀시트 -->
      <div id="arrive-time-sheet" class="sheet-overlay" hidden>
        <div class="sheet">
          <div class="sheet__handle"></div>
          <h2 class="text-heading-3">도착 시각</h2>
          <div class="date-input-row">
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="2" placeholder="00" id="arrive-time-hour" />
            <span class="date-input-unit">시</span>
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="2" placeholder="00" id="arrive-time-minute" />
            <span class="date-input-unit">분</span>
          </div>
          <button type="button" class="btn btn--primary btn--block" id="arrive-time-confirm">입력</button>
        </div>
      </div>

      <!-- 여행 기간 선택 바텀시트 -->
      <div id="trip-length-sheet" class="sheet-overlay" hidden>
        <div class="sheet">
          <div class="sheet__handle"></div>
          <h2 class="text-heading-3">예정된 여행 기간</h2>
          <div class="date-input-row">
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="3" placeholder="00" id="trip-length-days" />
            <span class="date-input-unit">일</span>
          </div>
          <button type="button" class="btn btn--primary btn--block" id="trip-length-confirm">입력</button>
        </div>
      </div>

      <!-- 마지막 비행 일자 선택 바텀시트 -->
      <div id="last-flight-sheet" class="sheet-overlay" hidden>
        <div class="sheet">
          <div class="sheet__handle"></div>
          <h2 class="text-heading-3">마지막 비행 일자</h2>
          <div class="date-input-row">
            <input class="field__input date-input" type="text" inputmode="numeric" maxlength="4" placeholder="2000" id="last-flight-year" />
            <span class="date-input-unit">년</span>
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="2" placeholder="00" id="last-flight-month" />
            <span class="date-input-unit">월</span>
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="2" placeholder="00" id="last-flight-day" />
            <span class="date-input-unit">일</span>
          </div>
          <button type="button" class="btn btn--primary btn--block" id="last-flight-confirm">입력</button>
        </div>
      </div>

      <!-- 총 비행 시간 선택 바텀시트 -->
      <div id="total-flight-time-sheet" class="sheet-overlay" hidden>
        <div class="sheet">
          <div class="sheet__handle"></div>
          <h2 class="text-heading-3">총 비행 시간</h2>
          <div class="date-input-row">
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="2" placeholder="00" id="total-flight-hour" />
            <span class="date-input-unit">시간</span>
            <input class="field__input date-input date-input--sm" type="text" inputmode="numeric" maxlength="2" placeholder="00" id="total-flight-minute" />
            <span class="date-input-unit">분</span>
          </div>
          <button type="button" class="btn btn--primary btn--block" id="total-flight-time-confirm">입력</button>
        </div>
      </div>

      <!-- 닫기 확인 모달 -->
      <div id="close-confirm-modal" class="modal" hidden>
        <div class="modal__box">
          <h2>정말로 닫으실 건가요?</h2>
          <p class="text-caption text-muted">지금 창을 닫으면 지금까지 입력한 내용이 저장되지 않고 모두 초기화돼요.</p>
          <div class="modal__actions">
            <button type="button" class="btn--cancel" id="close-cancel">취소</button>
            <button type="button" class="btn--confirm" id="close-confirm">닫기</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../components/header.js"></script>
    <script>
      // 헤더: X 버튼 클릭 시 커스텀 확인 모달 열기
      document.getElementById("header-mount").append(
        THRIVE.createHeader({
          title: "비행 여정 등록",
          onClose: function () {
            document.getElementById("close-confirm-modal").hidden = false;
          },
        })
      );
      document.getElementById("close-cancel").addEventListener("click", function () {
        document.getElementById("close-confirm-modal").hidden = true;
      });
      document.getElementById("close-confirm").addEventListener("click", function () {
        window.location.href = "./record.html";
      });

      // STEP 이동
      document.querySelectorAll("[data-next]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var next = btn.dataset.next;
          document.querySelectorAll(".trip-step").forEach(function (s) { s.hidden = true; });
          document.querySelector('.trip-step[data-step="' + next + '"]').hidden = false;
        });
      });
      document.querySelectorAll("[data-prev]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var prev = btn.dataset.prev;
          document.querySelectorAll(".trip-step").forEach(function (s) { s.hidden = true; });
          document.querySelector('.trip-step[data-step="' + prev + '"]').hidden = false;
        });
      });

      // 경유 여부
      document.querySelectorAll('[data-via]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.getElementById('wait-time-field').style.display =
            btn.dataset.via === 'yes' ? 'flex' : 'none';
        });
      });

      // 장거리 비행 여부 / 평소 컨디션 선택 토글
      document.querySelectorAll('[data-longhaul]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('[data-longhaul]').forEach(function (b) {
            b.classList.remove('btn--soft-selected');
            b.style.background = 'var(--color-gray-050)';
            b.style.color = 'var(--color-text)';
          });
          btn.classList.add('btn--soft-selected');
          btn.style.background = '';
          btn.style.color = '';
        });
      });
      document.querySelectorAll('[data-condition]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('[data-condition]').forEach(function (b) {
            b.classList.remove('btn--soft-selected');
            b.style.background = 'var(--color-gray-050)';
            b.style.color = 'var(--color-text)';
          });
          btn.classList.add('btn--soft-selected');
          btn.style.background = '';
          btn.style.color = '';
        });
      });

      // 확인 버튼 → 다음 화면 이동
      document.getElementById("trip-confirm").addEventListener("click", function () {
        window.location.href = "./expected-score.html";
      });

      // 출발 공항 선택 바텀시트
      var airportSheet = document.getElementById("airport-sheet");
      var departureValue = document.getElementById("departure-value");
      var selectedAirport = "";

      document.getElementById("departure-trigger").addEventListener("click", function () {
        airportSheet.hidden = false;
      });
      document.querySelectorAll("#airport-list .airport-list__item").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll("#airport-list .airport-list__item").forEach(function (b) {
            b.classList.remove("is-selected");
          });
          btn.classList.add("is-selected");
          selectedAirport = btn.dataset.airport;
        });
      });
      document.getElementById("airport-confirm").addEventListener("click", function () {
        if (selectedAirport) {
          departureValue.textContent = selectedAirport;
          departureValue.style.color = "var(--color-text)";
          departureValue.style.fontWeight = "600";
        }
        airportSheet.hidden = true;
        checkStep1();
      });
      airportSheet.addEventListener("click", function (e) {
        if (e.target === airportSheet) airportSheet.hidden = true;
      });

      // 출발일 선택 바텀시트
      var dateSheet = document.getElementById("date-sheet");
      var dateValueEl = document.getElementById("depart-date-value");

      document.getElementById("depart-date-trigger").addEventListener("click", function () {
        dateSheet.hidden = false;
      });
      document.getElementById("date-confirm").addEventListener("click", function () {
        var y = document.getElementById("date-year").value;
        var m = document.getElementById("date-month").value;
        var d = document.getElementById("date-day").value;
        if (y && m && d) {
          dateValueEl.textContent = y + "년 " + m + "월 " + d + "일";
        }
        dateSheet.hidden = true;
      });
      dateSheet.addEventListener("click", function (e) {
        if (e.target === dateSheet) dateSheet.hidden = true;
      });

      // STEP 1 유효성 검사: 공항 선택돼야 다음 버튼 활성화
      var step1NextBtn = document.getElementById('step1-next');
      function checkStep1() {
        step1NextBtn.disabled = !selectedAirport;
      }
      checkStep1();

      // 도착지 선택 바텀시트
      var arrivalSheet = document.getElementById("arrival-sheet");
      var arrivalValue = document.getElementById("arrival-value");
      var arrivalError = document.getElementById("arrival-error");
      var selectedArrival = "";

      document.getElementById("arrival-trigger").addEventListener("click", function () {
        arrivalSheet.hidden = false;
      });
      document.querySelectorAll("#arrival-list .airport-list__item").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll("#arrival-list .airport-list__item").forEach(function (b) {
            b.classList.remove("is-selected");
          });
          btn.classList.add("is-selected");
          selectedArrival = btn.dataset.airport;
        });
      });
      document.getElementById("arrival-confirm").addEventListener("click", function () {
        if (selectedArrival) {
          arrivalValue.textContent = selectedArrival;
          arrivalValue.style.color = "var(--color-text)";
          arrivalValue.style.fontWeight = "600";
          arrivalError.style.display = "none";
        }
        arrivalSheet.hidden = true;
      });
      arrivalSheet.addEventListener("click", function (e) {
        if (e.target === arrivalSheet) arrivalSheet.hidden = true;
      });

      // 도착일 선택 바텀시트
      var arriveDateSheet = document.getElementById("arrive-date-sheet");
      var arriveDateValueEl = document.getElementById("arrive-date-value");

      document.getElementById("arrive-date-trigger").addEventListener("click", function () {
        arriveDateSheet.hidden = false;
      });
      document.getElementById("arrive-date-confirm").addEventListener("click", function () {
        var y2 = document.getElementById("arrive-date-year").value;
        var m2 = document.getElementById("arrive-date-month").value;
        var d2 = document.getElementById("arrive-date-day").value;
        if (y2 && m2 && d2) {
          arriveDateValueEl.textContent = y2 + "년 " + m2 + "월 " + d2 + "일";
        }
        arriveDateSheet.hidden = true;
      });
      arriveDateSheet.addEventListener("click", function (e) {
        if (e.target === arriveDateSheet) arriveDateSheet.hidden = true;
      });

      // 도착 시각 선택 바텀시트
      var arriveTimeSheet = document.getElementById("arrive-time-sheet");
      var arriveTimeValueEl = document.getElementById("arrive-time-value");

      document.getElementById("arrive-time-trigger").addEventListener("click", function () {
        arriveTimeSheet.hidden = false;
      });
      document.getElementById("arrive-time-confirm").addEventListener("click", function () {
        var h = document.getElementById("arrive-time-hour").value;
        var min = document.getElementById("arrive-time-minute").value;
        if (h && min) {
          arriveTimeValueEl.textContent = h.padStart(2, "0") + ":" + min.padStart(2, "0");
        }
        arriveTimeSheet.hidden = true;
      });
      arriveTimeSheet.addEventListener("click", function (e) {
        if (e.target === arriveTimeSheet) arriveTimeSheet.hidden = true;
      });

      // 여행 기간 선택 바텀시트
      var tripLengthSheet = document.getElementById("trip-length-sheet");
      var tripLengthValueEl = document.getElementById("trip-length-value");

      document.getElementById("trip-length-trigger").addEventListener("click", function () {
        tripLengthSheet.hidden = false;
      });
      document.getElementById("trip-length-confirm").addEventListener("click", function () {
        var days = document.getElementById("trip-length-days").value;
        if (days) {
          tripLengthValueEl.textContent = days + "일";
        }
        tripLengthSheet.hidden = true;
      });
      tripLengthSheet.addEventListener("click", function (e) {
        if (e.target === tripLengthSheet) tripLengthSheet.hidden = true;
      });

      // 마지막 비행 일자 선택 바텀시트
      var lastFlightSheet = document.getElementById("last-flight-sheet");
      var lastFlightValueEl = document.getElementById("last-flight-value");

      document.getElementById("last-flight-trigger").addEventListener("click", function () {
        lastFlightSheet.hidden = false;
      });
      document.getElementById("last-flight-confirm").addEventListener("click", function () {
        var y3 = document.getElementById("last-flight-year").value;
        var m3 = document.getElementById("last-flight-month").value;
        var d3 = document.getElementById("last-flight-day").value;
        if (y3 && m3 && d3) {
          lastFlightValueEl.textContent = y3 + "년 " + m3 + "월 " + d3 + "일";
        }
        lastFlightSheet.hidden = true;
      });
      lastFlightSheet.addEventListener("click", function (e) {
        if (e.target === lastFlightSheet) lastFlightSheet.hidden = true;
      });

      // 총 비행 시간 선택 바텀시트
      var totalFlightTimeSheet = document.getElementById("total-flight-time-sheet");
      var totalFlightTimeValueEl = document.getElementById("total-flight-time-value");

      document.getElementById("total-flight-time-trigger").addEventListener("click", function () {
        totalFlightTimeSheet.hidden = false;
      });
      document.getElementById("total-flight-time-confirm").addEventListener("click", function () {
        var th = document.getElementById("total-flight-hour").value;
        var tm = document.getElementById("total-flight-minute").value;
        if (th && tm) {
          totalFlightTimeValueEl.textContent = th + "시간 " + tm + "분";
        }
        totalFlightTimeSheet.hidden = true;
      });
      totalFlightTimeSheet.addEventListener("click", function (e) {
        if (e.target === totalFlightTimeSheet) totalFlightTimeSheet.hidden = true;
      });
    </script>
