<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THRIVE · 기록</title>
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/record.css" />
  </head>
  <body>
    <!--
      기록 탭(record/trip-list) — 하단 탭바가 있는 목록 화면. 상단 헤더 없음.
      구조: 진행 중 여정(있으면) + 지난 여정 목록.
      지난 여정 카드를 누르면 저장된 회복 리포트 상세로 이동한다.

      [Django]
        · 진행 중 여정 : {% if ongoing_trip %} … {% endif %}
        · 지난 여정    : {% for trip in past_trips %} … {% endfor %}
        · 카드 링크    : href="{% url 'record:report' trip.id %}"
                        (아래는 데모용 상대경로. 연동 시 위 url 태그로 교체)
    -->
    <!--
      data-home : 홈(index.html) 경로. 하단 탭바 '메인' 링크를 이 값으로 교정한다.
                  [Django] data-home="{% url 'home:index' %}" 로 주입.
    -->
    <div class="app" id="app" data-home="../../../index.html">
      <main class="app__body">
        <!-- ============ 진행 중 여정 ============ -->
        <!-- [Django] {% if ongoing_trip %} -->
        <section>
          <h2 class="record-section__title text-heading-1">진행 중 여정</h2>

          <!-- [Django] 출발/도착 공항코드·한글명, 출발일시, 총 비행시간, 경유 수 주입 -->
          <article class="flight-card">
            <div class="flight-card__route">
              <div class="flight-card__point">
                <div class="flight-card__code">ICN</div>
                <div class="flight-card__airport">인천국제공항</div>
              </div>

              <span class="flight-card__plane" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M2.5 19h19v2h-19v-2zm19.57-9.36c-.21-.8-1.04-1.28-1.84-1.06L14.92 10 8 3.57 6.09 4.08l4.15 7.19-4.98 1.33-1.97-1.54-1.45.39 2.59 4.49L21 11.49c.81-.23 1.28-1.05 1.07-1.85z"/>
                </svg>
              </span>

              <div class="flight-card__point">
                <div class="flight-card__code">MXP</div>
                <div class="flight-card__airport">말펜사공항</div>
              </div>
            </div>

            <div class="flight-card__meta">
              <span>10월 11일(일) 15:30 출발</span>
              <span class="flight-card__sep" aria-hidden="true">│</span>
              <span>총 22시간 비행</span>
              <span class="flight-card__sep" aria-hidden="true">│</span>
              <span>경유 1</span>
            </div>
          </article>
        </section>
        <!-- [Django] {% endif %} -->

        <!-- ============ 지난 여정 ============ -->
        <section>
          <h2 class="record-section__title text-heading-1">지난 여정</h2>

          <!-- [Django] {% for trip in past_trips %} -->
          <div class="trip-list">
            <!-- 카드 1 -->
            <a class="trip-card" href="./report.html">
              <div class="trip-card__main">
                <div class="trip-card__route">
                  <span class="trip-card__point">
                    <span class="trip-card__code">BKK</span>
                    <span class="trip-card__city">수완나품</span>
                  </span>
                  <svg class="trip-card__arrow" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                  <span class="trip-card__point">
                    <span class="trip-card__code">ICN</span>
                    <span class="trip-card__city">인천</span>
                  </span>
                </div>
                <div class="trip-card__meta">26년 09월 17일<span class="trip-card__meta-sep" aria-hidden="true">│</span>9시간 55분<span class="trip-card__meta-sep" aria-hidden="true">│</span>경유 1</div>
              </div>
              <div class="trip-card__score">
                <span class="trip-card__score-label">점수</span>
                <span class="trip-card__score-value">89</span>
              </div>
            </a>

            <!-- 카드 2 -->
            <a class="trip-card" href="./report.html">
              <div class="trip-card__main">
                <div class="trip-card__route">
                  <span class="trip-card__point">
                    <span class="trip-card__code">ICN</span>
                    <span class="trip-card__city">인천</span>
                  </span>
                  <svg class="trip-card__arrow" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                  <span class="trip-card__point">
                    <span class="trip-card__code">BKK</span>
                    <span class="trip-card__city">수완나품</span>
                  </span>
                </div>
                <div class="trip-card__meta">26년 09월 14일<span class="trip-card__meta-sep" aria-hidden="true">│</span>6시간 5분</div>
              </div>
              <div class="trip-card__score">
                <span class="trip-card__score-label">점수</span>
                <span class="trip-card__score-value">72</span>
              </div>
            </a>

            <!-- 카드 3 -->
            <a class="trip-card" href="./report.html">
              <div class="trip-card__main">
                <div class="trip-card__route">
                  <span class="trip-card__point">
                    <span class="trip-card__code">LAX</span>
                    <span class="trip-card__city">로스앤젤레스</span>
                  </span>
                  <svg class="trip-card__arrow" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                  <span class="trip-card__point">
                    <span class="trip-card__code">ICN</span>
                    <span class="trip-card__city">인천</span>
                  </span>
                </div>
                <div class="trip-card__meta">26년 08월 29일<span class="trip-card__meta-sep" aria-hidden="true">│</span>13시간</div>
              </div>
              <div class="trip-card__score">
                <span class="trip-card__score-label">점수</span>
                <span class="trip-card__score-value">58</span>
              </div>
            </a>

            <!-- 카드 4 -->
            <a class="trip-card" href="./report.html">
              <div class="trip-card__main">
                <div class="trip-card__route">
                  <span class="trip-card__point">
                    <span class="trip-card__code">ICN</span>
                    <span class="trip-card__city">인천</span>
                  </span>
                  <svg class="trip-card__arrow" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                  <span class="trip-card__point">
                    <span class="trip-card__code">LAX</span>
                    <span class="trip-card__city">로스앤젤레스</span>
                  </span>
                </div>
                <div class="trip-card__meta">26년 08월 26일<span class="trip-card__meta-sep" aria-hidden="true">│</span>11시간 20분</div>
              </div>
              <div class="trip-card__score">
                <span class="trip-card__score-label">점수</span>
                <span class="trip-card__score-value">67</span>
              </div>
            </a>
          </div>
          <!-- [Django] {% endfor %} -->
        </section>
      </main>

      <!-- 하단 탭바 mount 자리: 기록 탭 활성 -->
    </div>

    <script src="../../components/tab-bar.js"></script>
    <script>
      (function () {
        var app = document.getElementById("app");
        var tabbar = THRIVE.createTabBar({ active: "record" });
        // 탭바 '메인' 탭의 링크를 실제 홈 위치로 교정한다.
        // (JS에 경로를 하드코딩하지 않고 app[data-home] 값을 사용 → Django에서 그대로 주입 가능)
        var homeTab = tabbar.querySelector('a[data-key="home"]');
        if (homeTab && app.dataset.home) homeTab.setAttribute("href", app.dataset.home);
        app.append(tabbar);
      })();
    </script>
  </body>
</html>
