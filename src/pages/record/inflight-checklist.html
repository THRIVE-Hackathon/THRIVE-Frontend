<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THRIVE · 기내 컨디션 관리</title>
    <link rel="stylesheet" href="../../styles/reset.css" />
    <link rel="stylesheet" href="../../styles/variables.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/record.css" />
  </head>
  <body>
    <div class="app" id="app">
      <div id="header-mount"></div>
      <main class="app__body">
        <h1 class="text-title-1">기내 컨디션 관리</h1>
        <p class="text-caption text-muted">착륙까지 남은 시간 동안 할 수 있는 행동들을 기록하세요</p>

        <div class="factor-box">
          <div class="counter-row">
            <span>물 마셨어요</span>
            <div class="counter-row__btns">
              <button type="button" data-target="water" data-op="minus">-</button>
              <span class="counter-row__value" id="water-count">3잔</span>
              <button type="button" data-target="water" data-op="plus">+</button>
            </div>
          </div>
          <div class="counter-row">
            <span>걸었어요</span>
            <div class="counter-row__btns">
              <button type="button" data-target="walk" data-op="minus">-</button>
              <span class="counter-row__value" id="walk-count">2회</span>
              <button type="button" data-target="walk" data-op="plus">+</button>
            </div>
          </div>
          <div class="counter-row">
            <span>보습했어요</span>
            <div class="counter-row__btns">
              <button type="button" data-target="skin" data-op="minus">-</button>
              <span class="counter-row__value" id="skin-count">1회</span>
              <button type="button" data-target="skin" data-op="plus">+</button>
            </div>
          </div>
        </div>

        <p class="text-caption text-muted">각 항목을 입력할 때마다 점수가 조정됩니다.</p>
        <p class="score-summary__note">현재 기록은 실측 점수 계산에 반영되며, 착륙 후 정산 화면에서 확인할 수 있습니다.</p>
      </main>
    </div>
    <script src="../../components/header.js"></script>
    <script>
      document.getElementById("header-mount").append(
        THRIVE.createHeader({
          title: "기내 컨디션 관리",
          onClose: function () { history.back(); },
        })
      );
      // TODO: +/- 버튼 클릭 시 카운트 증감 로직
    </script>
  </body>
</html>
