      <main class="app__body">
        <!-- 인사말: 닉네임 / 남은 시간은 서버 주입 -->
        <h1 class="home-greeting text-title-1">
          <span data-user>유저</span>님, 회복 루틴 종료까지<br />
          <span class="home-greeting__accent"
            ><span data-remaining-hours>68</span>시간</span
          >
          남았어요.
        </h1>
      </main>

      <!-- 하단 탭바: JS 로 mount (active="home") -->
      <div id="tabbar-mount"></div>
    </div>

    <!-- 컴포넌트 & 스크립트 -->
    <script src="src/components/tab-bar.js"></script>
    <script src="src/scripts/home.js"></script>
    <script>
      // 하단 탭바 mount (실제 이동경로는 tab-bar.js 의 TABS 에서 관리)
      document
        .getElementById("tabbar-mount")
        .append(THRIVE.createTabBar({ active: "home" }));
    </script>
  </body>
</html>
